<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tri-Therapy Bundle | Dr. Marwa Badr</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css?v=3">
    <style>
        body{margin:0;}
        /* Theme toggle icons */
        [data-theme="dark"]  #theme-icon-light { display: none; }
        [data-theme="dark"]  #theme-icon-dark  { display: inline; }
        [data-theme="light"] #theme-icon-light { display: inline; }
        [data-theme="light"] #theme-icon-dark  { display: none; }
        .page-wrap{display:flex;min-height:100vh;padding-top:var(--nav-height);}
        .sidebar{width:300px;flex-shrink:0;background:var(--alt-bg);border-right:1px solid var(--border);height:calc(100vh - var(--nav-height));position:sticky;top:var(--nav-height);overflow-y:auto;}
        .sidebar-header{padding:1.25rem;border-bottom:1px solid var(--border);}
        .sidebar-header h2{font-size:0.95rem;margin:0 0 0.25rem;}
        .sidebar-header p{font-size:0.75rem;color:var(--muted);margin:0;}
        .prog-bar{height:4px;background:var(--border);border-radius:2px;margin-top:0.75rem;overflow:hidden;}
        .prog-fill{height:100%;background:var(--primary);border-radius:2px;transition:width 0.4s;width:7%;}
        .prog-text{font-size:0.72rem;color:var(--muted);margin-top:0.35rem;}
        .section-group{border-bottom:1px solid var(--border);}
        .section-label{padding:0.65rem 1.25rem;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:0.4rem;}
        .section-label i{color:var(--primary);}
        .mod-btn{padding:0.65rem 1.25rem 0.65rem 2rem;display:flex;align-items:center;gap:0.6rem;cursor:pointer;font-size:0.855rem;transition:background 0.15s;border:none;border-left:3px solid transparent;background:none;width:100%;text-align:left;color:var(--text);}
        .mod-btn:hover{background:rgba(20,184,166,0.06);}
        .mod-btn.active{background:rgba(20,184,166,0.1);color:var(--primary);font-weight:600;border-left-color:var(--primary);}
        .mod-btn i{font-size:0.95rem;color:var(--muted);flex-shrink:0;}
        .mod-btn.active i{color:var(--primary);}
        .main{flex:1;padding:2.5rem;max-width:860px;}
        .badges{display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem;}
        .badge{display:inline-flex;align-items:center;gap:0.3rem;padding:0.25rem 0.7rem;border-radius:20px;font-size:0.72rem;font-weight:600;}
        .b-bundle{background:rgba(249,115,22,0.12);color:#fb923c;}
        .b-dbt{background:rgba(139,92,246,0.12);color:#a78bfa;}
        .b-cbt{background:rgba(59,130,246,0.12);color:#60a5fa;}
        .b-act{background:rgba(20,184,166,0.12);color:var(--primary);}
        .video-box{width:100%;aspect-ratio:16/9;background:#080d1a;border-radius:var(--border-radius);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:1.75rem;position:relative;overflow:hidden;}
        .video-box::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(20,184,166,0.07) 0%,transparent 70%);}
        .play-btn{width:60px;height:60px;border-radius:50%;background:var(--primary);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#0f172a;transition:transform 0.2s,box-shadow 0.2s;z-index:1;}
        .play-btn:hover{transform:scale(1.1);box-shadow:0 0 28px rgba(20,184,166,0.5);}
        .video-box p{color:var(--muted);font-size:0.82rem;margin-top:0.75rem;z-index:1;}
        .meta{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem;}
        .chip{display:inline-flex;align-items:center;gap:0.4rem;background:var(--alt-bg);border:1px solid var(--border);border-radius:8px;padding:0.4rem 0.8rem;font-size:0.8rem;color:var(--muted);}
        .chip i{color:var(--primary);}
        .sec-h{font-size:1.05rem;margin:1.75rem 0 0.75rem;display:flex;align-items:center;gap:0.5rem;}
        .sec-h i{color:var(--primary);}
        .body-p{color:var(--muted);line-height:1.8;font-size:0.93rem;}
        .mats{background:var(--alt-bg);border:1px solid var(--border);border-radius:10px;padding:1.25rem;margin-top:1.5rem;}
        .mats h3{font-size:0.9rem;margin:0 0 1rem;display:flex;align-items:center;gap:0.4rem;}
        .mats h3 i{color:var(--primary);}
        .mat-a{display:flex;align-items:center;gap:0.6rem;padding:0.55rem 0.75rem;border-radius:8px;text-decoration:none;color:var(--text);font-size:0.85rem;transition:background 0.15s;margin-bottom:0.2rem;}
        .mat-a:hover{background:rgba(20,184,166,0.08);color:var(--primary);}
        .mat-a i{color:var(--primary);}
        .nav-btns{display:flex;justify-content:space-between;margin-top:2.5rem;gap:1rem;}
        .nav-btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.7rem 1.25rem;border-radius:8px;border:1px solid var(--border);background:var(--alt-bg);color:var(--text);cursor:pointer;font-size:0.875rem;font-family:inherit;transition:all 0.2s;}
        .nav-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary);}
        .nav-btn:disabled{opacity:0.4;cursor:not-allowed;}
        .nav-btn.primary{background:var(--primary);color:#0f172a;border-color:var(--primary);font-weight:600;}
        .nav-btn.primary:hover:not(:disabled){opacity:0.9;}
        #loader{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;}
        .spinner{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg)}}
        @media(max-width:768px){.page-wrap{flex-direction:column;}.sidebar{width:100%;height:auto;position:static;}.main{padding:1.25rem;}}
    </style>
    <!-- Favicon & App Icons -->
    <link rel="icon" href="images/profile-pic-nav.png" type="image/png">
    <link rel="apple-touch-icon" href="images/profile-pic-nav.png">
    
    <!-- SEO & Social Media Meta Tags -->
    <meta name="description" content="Dr. Marwa Badr - Consultant & Trainer for Mental Health Professionals. Advanced training in CBT, DBT, and ACT therapies.">
    <meta name="keywords" content="Dr. Marwa Badr, دكتورة مروة بدر, العلاج النفسي, CBT, DBT, ACT, العلاج المعرفي السلوكي, كورسات علم نفس, تدريب أخصائيين نفسيين">
    <meta name="author" content="Dr. Marwa Badr">
    
    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:title" content="Dr. Marwa Badr Platform">
    <meta property="og:description" content="Empowering psychologists with advanced evidence-based practices (CBT, DBT, ACT).">
    <meta property="og:image" content="https://drmarwa.pages.dev/images/profile-pic-nav.png">
    <meta property="og:url" content="https://drmarwa.pages.dev/">
    <meta property="og:type" content="website">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dr. Marwa Badr Platform">
    <meta name="twitter:description" content="Empowering psychologists with advanced evidence-based practices (CBT, DBT, ACT).">
    <meta name="twitter:image" content="https://drmarwa.pages.dev/images/profile-pic-nav.png">
</head>

<body>

<nav class="navbar">
    <div class="nav-container">
        <a href="my-courses.html" class="logo" style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;"><i class="ph ph-arrow-left"></i> My Courses</a>
        <div style="display:flex;align-items:center;gap:1rem;">
            <span id="user-name" style="font-size:0.82rem;color:var(--muted);"></span>
            <button id="theme-toggle" aria-label="Toggle Theme"><i class="ph ph-sun" id="theme-icon-light"></i><i class="ph ph-moon" id="theme-icon-dark"></i></button>
        </div>
    </div>
</nav>

<!-- Loader -->
<div id="loader">
    <div class="spinner"></div>
    <p style="color:var(--muted);font-size:0.9rem;">جاري التحقق من الصلاحية...</p>
</div>

<!-- Page (hidden until access confirmed) -->
<div class="content-layout" id="page-content" style="display:none; align-items: center; justify-content: center; height: 75vh; width: 100%;">
    <div style="text-align: center; color: var(--muted); margin: auto;">
        <i class="ph ph-hourglass-high" style="font-size: 3rem; margin-bottom: 1rem; color: var(--primary);"></i>
        <h2>سيتم إضافة المحتوى قريباً</h2>
        <p style="margin-top:0.5rem;font-size:0.95rem;">نعمل حالياً على تجهيز المحتوى العلمي الخاص بهذا الكورس.</p>
    </div>
</div>
<script src="js/payment-service.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const ps = window.PaymentService;
        const hasAccess = await ps.checkAccess('tri-therapy-bundle');
        
        if (!hasAccess) {
            window.location.href = 'my-courses.html';
            return;
        }

        const user = ps.getUser();
        if (user && document.getElementById('user-name')) {
            document.getElementById('user-name').textContent = user.name || user.email;
        }

        const loader = document.getElementById('access-loader') || document.getElementById('loader');
        const page = document.getElementById('page-content') || document.getElementById('page');
        
        if(loader) loader.style.display = 'none';
        if(page) page.style.display = 'flex';
    });
    </script>
</body>
</html>
