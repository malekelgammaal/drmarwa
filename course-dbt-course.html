<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dialectical Behavior Therapy (DBT) | Dr. Marwa Badr</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css?v=3">
    <style>
        body{margin:0;}
        /* Theme toggle icons */
        [data-theme="dark"]  #theme-icon-light { display: none; }
        [data-theme="dark"]  #theme-icon-dark  { display: inline; }
        [data-theme="light"] #theme-icon-light { display: inline; }
        [data-theme="light"] #theme-icon-dark  { display: none; }

        .content-layout{display:flex;min-height:calc(100vh - var(--nav-height));margin-top:var(--nav-height);}
        .sidebar{width:290px;flex-shrink:0;background:var(--alt-bg);border-right:1px solid var(--border);padding:0;height:calc(100vh - var(--nav-height));position:sticky;top:var(--nav-height);overflow-y:auto;}
        .sidebar-header{padding:1.25rem;border-bottom:1px solid var(--border);}
        .sidebar-header h3{font-size:0.9rem;margin:0 0 0.25rem;}
        .sidebar-header p{font-size:0.75rem;color:var(--muted);margin:0;}
        .prog-bar{height:4px;background:var(--border);border-radius:2px;margin-top:0.75rem;overflow:hidden;}
        .prog-fill{height:100%;background:var(--primary);border-radius:2px;transition:width 0.4s;width:0%;}
        .prog-text{font-size:0.72rem;color:var(--muted);margin-top:0.35rem;}
        .module-list{list-style:none;padding:0.5rem 0;margin:0;}
        .module-list li{padding:0.75rem 1.25rem;display:flex;align-items:center;gap:0.6rem;cursor:pointer;font-size:0.865rem;transition:background 0.15s,color 0.15s;border-left:3px solid transparent;}
        .module-list li:hover{background:rgba(20,184,166,0.06);}
        .module-list li.active{border-left-color:var(--primary);background:rgba(20,184,166,0.1);color:var(--primary);font-weight:600;}
        .module-list li i{font-size:1rem;color:var(--muted);flex-shrink:0;}
        .module-list li.active i{color:var(--primary);}
        .main-content{flex:1;padding:2.5rem;max-width:860px;}
        .course-badge{display:inline-flex;align-items:center;gap:0.3rem;background:rgba(139,92,246,0.12);color:#a78bfa;padding:0.25rem 0.75rem;border-radius:20px;font-size:0.75rem;font-weight:700;margin-bottom:1rem;}
        .video-box{width:100%;aspect-ratio:16/9;background:#080d1a;border-radius:var(--border-radius);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:2rem;position:relative;overflow:hidden;}
        .video-box::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(139,92,246,0.12) 0%,transparent 70%);}
        .play-btn{width:60px;height:60px;border-radius:50%;background:var(--primary);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#0f172a;transition:transform 0.2s,box-shadow 0.2s;z-index:1;}
        .play-btn:hover{transform:scale(1.1);box-shadow:0 0 28px rgba(20,184,166,0.5);}
        .video-box p{color:var(--muted);font-size:0.82rem;margin-top:0.75rem;z-index:1;}
        .meta-row{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem;}
        .meta-chip{display:inline-flex;align-items:center;gap:0.4rem;background:var(--alt-bg);border:1px solid var(--border);border-radius:8px;padding:0.4rem 0.8rem;font-size:0.8rem;color:var(--muted);}
        .meta-chip i{color:var(--primary);}
        .section-h2{font-size:1.05rem;margin:1.75rem 0 0.75rem;display:flex;align-items:center;gap:0.5rem;}
        .section-h2 i{color:var(--primary);}
        .body-text{color:var(--muted);line-height:1.8;font-size:0.93rem;}
        .materials{background:var(--alt-bg);border:1px solid var(--border);border-radius:10px;padding:1.25rem;margin-top:1.5rem;}
        .materials h3{font-size:0.9rem;margin:0 0 1rem;display:flex;align-items:center;gap:0.4rem;}
        .materials h3 i{color:var(--primary);}
        .mat-link{display:flex;align-items:center;gap:0.6rem;padding:0.55rem 0.75rem;border-radius:8px;text-decoration:none;color:var(--text);font-size:0.85rem;transition:background 0.15s;margin-bottom:0.2rem;}
        .mat-link:hover{background:rgba(20,184,166,0.08);color:var(--primary);}
        .mat-link i{color:var(--primary);font-size:1rem;}
        .nav-btns{display:flex;justify-content:space-between;margin-top:2.5rem;gap:1rem;}
        .nav-btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.7rem 1.25rem;border-radius:8px;border:1px solid var(--border);background:var(--alt-bg);color:var(--text);cursor:pointer;font-size:0.875rem;font-family:inherit;transition:all 0.2s;}
        .nav-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary);}
        .nav-btn:disabled{opacity:0.4;cursor:not-allowed;}
        .nav-btn.primary{background:var(--primary);color:#0f172a;border-color:var(--primary);font-weight:600;}
        .nav-btn.primary:hover:not(:disabled){background:var(--primary-hover);}
        @media(max-width:768px){.content-layout{flex-direction:column;}.sidebar{width:100%;height:auto;position:static;}}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
    <!-- Favicon & App Icons -->
    <link rel="icon" href="images/profile-pic-nav.png" type="image/png">
    <link rel="apple-touch-icon" href="images/profile-pic-nav.png">
    
    <!-- SEO & Social Media Meta Tags -->
    <meta name="description" content="Dr. Marwa Badr - Consultant & Trainer for Mental Health Professionals. Advanced training in CBT, DBT, and ACT therapies.">
    <meta name="keywords" content="Dr. Marwa Badr, دكتورة مروة بدر, العلاج النفسي, CBT, DBT, ACT, العلاج المعرفي السلوكي, كورسات علم نفس, تدريب أخصائيين نفسيين">
    <meta name="author" content="Dr. Marwa Badr">
    
    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:title" content="Dr. Marwa Badr Platform">
    <meta property="og:description" content="Empowering psychologists with advanced evidence-based practices (CBT, DBT, ACT).">
    <meta property="og:image" content="https://drmarwa.pages.dev/images/profile-pic-nav.png">
    <meta property="og:url" content="https://drmarwa.pages.dev/">
    <meta property="og:type" content="website">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dr. Marwa Badr Platform">
    <meta name="twitter:description" content="Empowering psychologists with advanced evidence-based practices (CBT, DBT, ACT).">
    <meta name="twitter:image" content="https://drmarwa.pages.dev/images/profile-pic-nav.png">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="my-courses.html" class="logo" style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;"><i class="ph ph-arrow-right"></i> كورساتي</a>
            <div style="display:flex;align-items:center;gap:1rem;">
                <span id="user-welcome" style="font-size:0.82rem;color:var(--muted);"></span>
                <button id="theme-toggle" aria-label="Toggle Theme">
                    <i class="ph ph-sun" id="theme-icon-light"></i>
                    <i class="ph ph-moon" id="theme-icon-dark"></i>
                </button>
            </div>
        </div>
    </nav>

    <div id="access-loader" style="position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;">
        <div style="width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <p style="color:var(--muted);font-size:0.9rem;">جاري التحقق من الصلاحية...</p>
    </div>

    <div class="content-layout" id="page-content" style="display:none; align-items: center; justify-content: center; height: 75vh; width: 100%;">
    <div style="text-align: center; color: var(--muted); margin: auto;">
        <i class="ph ph-hourglass-high" style="font-size: 3rem; margin-bottom: 1rem; color: var(--primary);"></i>
        <h2>سيتم إضافة المحتوى قريباً</h2>
        <p style="margin-top:0.5rem;font-size:0.95rem;">نعمل حالياً على تجهيز المحتوى العلمي الخاص بهذا الكورس.</p>
    </div>
</div>
<script src="js/payment-service.js"></script>
        <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const ps = window.PaymentService;
        if (!ps) {
            console.error('[CourseGuard] PaymentService not loaded - redirecting to home.');
            window.location.href = 'index.html';
            return;
        }

        const hasAccess = await ps.checkAccess('dbt-course');
        
        if (!hasAccess) {
            window.location.href = 'my-courses.html';
            return;
        }

        const user = ps.getUser();
        if (user && document.getElementById('user-welcome')) {
            document.getElementById('user-welcome').textContent = user.user_metadata?.name || user.email || '';
        }

        const loader = document.getElementById('access-loader') || document.getElementById('loader');
        const page = document.getElementById('page-content') || document.getElementById('page');
        
        if (loader) loader.style.display = 'none';
        if (page) page.style.display = 'flex';
    });
    </script>
</body>
</html>
