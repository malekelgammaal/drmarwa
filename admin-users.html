<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Active Users</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css?v=3">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 4rem auto;
            padding: 2rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }
        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .admin-header h1 {
            margin: 0;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
        }
        .users-table {
            width: 100%;
            border-collapse: collapse;
        }
        .users-table th, .users-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .users-table th {
            background: var(--alt-bg);
            color: var(--muted);
            font-weight: 500;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        .users-table tr:hover {
            background: rgba(45, 212, 191, 0.05);
        }
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            margin-right: 0.5rem;
            box-shadow: 0 0 8px #10b981;
        }
        .refresh-btn {
            background: var(--alt-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: inherit;
            transition: all 0.2s;
        }
        .refresh-btn:hover {
            background: var(--primary);
            color: var(--bg);
            border-color: var(--primary);
        }
        .error-state {
            text-align: center;
            padding: 3rem;
            color: #ef4444;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--muted);
        }
    </script>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <div class="logo-icon">M</div>
                <div class="logo-text">Dr. Marwa Badr</div>
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
            </div>
        </div>
    </nav>

    <div class="admin-container" id="admin-content" style="display:none;">
        <div class="admin-header">
            <h1><i class="ph ph-users-three"></i> Active Users Dashboard</h1>
            <button class="refresh-btn" onclick="loadActiveUsers()" id="refresh-btn">
                <i class="ph ph-arrows-clockwise"></i> Refresh
            </button>
        </div>
        
        <div id="table-container">
            <div style="text-align:center; padding:3rem;"><i class="ph ph-circle-notch ph-spin" style="font-size:2rem;color:var(--primary);"></i></div>
        </div>
    </div>
    
    <div id="unauthorized" class="admin-container" style="display:none; text-align:center; color:#ef4444;">
        <i class="ph ph-shield-warning" style="font-size: 3rem; margin-bottom: 1rem;"></i>
        <h2>Access Denied</h2>
        <p>You do not have permission to view this page. Please log in with the administrator account.</p>
        <a href="index.html" class="btn-primary" style="display:inline-block; margin-top:1rem; text-decoration:none;">Return to Home</a>
    </div>

    <script src="js/payment-service.js"></script>
    <script>
        const API_BASE = 'https://drmarwa.onrender.com';
        
        function formatTimeAgo(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMins / 60);
            
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins} min${diffMins > 1 ? 's' : ''} ago`;
            if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
            return date.toLocaleDateString();
        }

        async function loadActiveUsers() {
            const btn = document.getElementById('refresh-btn');
            const icon = btn.querySelector('i');
            icon.classList.add('ph-spin');
            
            let session = null;
            try {
                session = JSON.parse(localStorage.getItem('site_current_session') || 'null');
            } catch (e) {
                console.error('Session parse error:', e);
            }
            
            if (!session?.access_token) {
                document.getElementById('admin-content').style.display = 'none';
                document.getElementById('unauthorized').style.display = 'block';
                icon.classList.remove('ph-spin');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/admin/active-users`, {
                    headers: { 'Authorization': `Bearer ${session.access_token}` }
                });
                
                if (res.status === 401 || res.status === 403) {
                    document.getElementById('admin-content').style.display = 'none';
                    document.getElementById('unauthorized').style.display = 'block';
                    return;
                }
                
                if (!res.ok) throw new Error('Failed to fetch data');
                
                const data = await res.json();
                
                const container = document.getElementById('table-container');
                if (data.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="ph ph-ghost" style="font-size:3rem; margin-bottom:1rem; opacity:0.5;"></i>
                            <h3>No Active Users</h3>
                            <p>There are currently no users logged into the platform.</p>
                        </div>
                    `;
                } else {
                    let html = `
                        <table class="users-table">
                            <thead>
                                <tr>
                                    <th>Status</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Last Active</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    data.forEach(user => {
                        html += `
                            <tr>
                                <td><span class="status-indicator"></span> Online</td>
                                <td style="font-weight:500; color:var(--text);">${user.name || 'Unknown'}</td>
                                <td style="color:var(--muted);">${user.email}</td>
                                <td style="color:var(--muted); font-size:0.9rem;">${formatTimeAgo(user.last_seen)}</td>
                            </tr>
                        `;
                    });
                    
                    html += `</tbody></table>`;
                    container.innerHTML = html;
                }
                
                document.getElementById('admin-content').style.display = 'block';
                
            } catch (err) {
                document.getElementById('table-container').innerHTML = `
                    <div class="error-state">
                        <i class="ph ph-warning-circle" style="font-size:3rem; margin-bottom:1rem;"></i>
                        <p>${err.message}</p>
                    </div>
                `;
            } finally {
                icon.classList.remove('ph-spin');
            }
        }

        document.addEventListener('DOMContentLoaded', loadActiveUsers);
    </script>
</body>
</html>
