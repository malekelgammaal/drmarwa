<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses | Dr. Marwa Badr</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css?v=3">
    <style>
        /* ── Page Layout ── */
        .page-wrapper { min-height: 100vh; padding-top: var(--nav-height); }

        /* ── Top Bar ── */
        .top-bar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .top-bar-left { display: flex; align-items: center; gap: 1rem; }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.875rem;
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .back-btn:hover { color: var(--primary); border-color: var(--primary); }
        .user-greeting { font-size: 0.9rem; color: var(--muted); }
        .user-greeting strong { color: var(--text); }

        /* ── Hero ── */
        .hero-section {
            background: linear-gradient(135deg, rgba(20,184,166,0.08) 0%, transparent 60%);
            border-bottom: 1px solid var(--border);
            padding: 3rem 2rem 2rem;
        }
        .hero-inner { max-width: 1100px; margin: 0 auto; }
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(20,184,166,0.12);
            color: var(--primary);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            margin-bottom: 1rem;
        }
        .hero-section h1 { font-size: 2.2rem; font-weight: 700; margin: 0 0 0.5rem; }
        .hero-section p { color: var(--muted); font-size: 1rem; margin: 0; }

        /* ── Stats Bar ── */
        .stats-bar {
            max-width: 1100px;
            margin: 2rem auto 0;
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .stat-pill {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 0.5rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }
        .stat-pill i { color: var(--primary); font-size: 1rem; }
        .stat-pill strong { color: var(--text); }
        .stat-pill span { color: var(--muted); }

        /* ── Main Content ── */
        .main-content { max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem; }

        /* ── Section Header ── */
        .section-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── Course Grid ── */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        /* Course Cards use global styles from style.css */

        /* ── Loading State ── */
        .loading-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem;
            color: var(--muted);
        }
        .loading-state i { font-size: 2.5rem; color: var(--primary); margin-bottom: 1rem; display: block; }

        /* ── Empty State ── */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 2rem;
        }
        .empty-icon {
            width: 80px;
            height: 80px;
            background: rgba(20,184,166,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }
        .empty-icon i { font-size: 2rem; color: var(--primary); }
        .empty-state h2 { margin: 0 0 0.5rem; font-size: 1.4rem; }
        .empty-state p { color: var(--muted); margin-bottom: 2rem; }

        @media (max-width: 600px) {
            .hero-section { padding: 2rem 1rem 1.5rem; }
            .hero-section h1 { font-size: 1.6rem; }
            .main-content { padding: 1.5rem 1rem; }
            .top-bar { padding: 0.75rem 1rem; }
        }
    </style>
    <!-- Favicon & App Icons -->
    <link rel="icon" href="images/profile-pic-nav.png" type="image/png">
    <link rel="apple-touch-icon" href="images/profile-pic-nav.png">
    
    <!-- SEO & Social Media Meta Tags -->
    <meta name="description" content="Dr. Marwa Badr - Consultant & Trainer for Mental Health Professionals. Advanced training in CBT, DBT, and ACT therapies.">
    <meta name="keywords" content="Dr. Marwa Badr, دكتورة مروة بدر, العلاج النفسي, CBT, DBT, ACT, العلاج المعرفي السلوكي, كورسات علم نفس, تدريب أخصائيين نفسيين">
    <meta name="author" content="Dr. Marwa Badr">
    
    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:title" content="Dr. Marwa Badr Platform">
    <meta property="og:description" content="Empowering psychologists with advanced evidence-based practices (CBT, DBT, ACT).">
    <meta property="og:image" content="https://drmarwa.pages.dev/images/profile-pic-nav.png">
    <meta property="og:url" content="https://drmarwa.pages.dev/">
    <meta property="og:type" content="website">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dr. Marwa Badr Platform">
    <meta name="twitter:description" content="Empowering psychologists with advanced evidence-based practices (CBT, DBT, ACT).">
    <meta name="twitter:image" content="https://drmarwa.pages.dev/images/profile-pic-nav.png">
</head>

<body>

    <!-- Top Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo" style="display:flex;align-items:center;gap:0.5rem;">
                <img src="images/profile-pic-nav.png" alt="Dr. Marwa" class="logo-img">
                Dr. Marwa
            </a>
            <div class="nav-actions">
                <span id="nav-user-name" style="font-size:0.875rem;color:var(--muted);"></span>
                <button id="theme-toggle" aria-label="Toggle Theme">
                    <i class="ph ph-sun" id="theme-icon-light"></i>
                    <i class="ph ph-moon" id="theme-icon-dark"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="page-wrapper">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <a href="index.html#courses" class="back-btn">
                    <i class="ph ph-arrow-right"></i> تصفح الكورسات
                </a>
            </div>
            <div style="display:flex;align-items:center;gap:1rem;">
                <a href="profile.html" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.875rem;display:flex;align-items:center;gap:0.4rem;font-family:inherit;text-decoration:none;transition:color 0.2s;" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--muted)'">
                    <i class="ph ph-user-circle"></i> حسابي
                </a>
            <button id="logout-btn" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.875rem;display:flex;align-items:center;gap:0.4rem;font-family:inherit;" onclick="handleLogout()">
                <i class="ph ph-sign-out"></i> تسجيل الخروج
            </button>
            </div>
        </div>

        <!-- Hero Section -->
        <div class="hero-section">
            <div class="hero-inner">
                <div class="hero-badge"><i class="ph ph-book-open"></i> مكتبتي التعليمية</div>
                <h1 id="hero-heading">كورساتي</h1>
                <p>جميع كورساتك التي قمت بشرائها — متاحة في أي وقت، مدى الحياة.</p>

                <!-- Stats Bar -->
                <div class="stats-bar" id="stats-bar" style="display:none;">
                    <div class="stat-pill">
                        <i class="ph ph-graduation-cap"></i>
                        <strong id="stat-count">0</strong>
                        <span>كورس مملوك</span>
                    </div>
                    <div class="stat-pill">
                        <i class="ph ph-infinity"></i>
                        <strong>دخول</strong>
                        <span>مدى الحياة</span>
                    </div>
                    <div class="stat-pill">
                        <i class="ph ph-currency-dollar"></i>
                        <strong id="stat-invested">0</strong>
                        <span>إجمالي الاستثمار</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="section-label">
                <i class="ph ph-books"></i> كورساتك
            </div>
            <div class="courses-grid" id="courses-grid">
                <div class="loading-state">
                    <i class="ph ph-circle-notch ph-spin"></i>
                    <p>جاري تحميل كورساتك...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
    // ============================================================
    //  My Courses Page — Dr. Marwa Badr Platform
    // ============================================================

    const API_BASE = 'https://drmarwa.onrender.com';

    // CATALOG removed: data is now provided dynamically from the backend

    // ── Theme ──
    const html = document.documentElement;
    const savedTheme = localStorage.getItem('theme') || 'dark';
    html.setAttribute('data-theme', savedTheme);
    document.getElementById('theme-toggle').addEventListener('click', () => {
        const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    });

    // ── Auth Guard ──
    function getSession() {
        return JSON.parse(localStorage.getItem('site_current_session') || 'null');
    }
    function getUser() {
        return JSON.parse(localStorage.getItem('site_current_user') || 'null');
    }
    function handleLogout() {
        localStorage.removeItem('site_current_session');
        localStorage.removeItem('site_current_user');
        window.location.href = 'index.html';
    }

    // ── Format Date ──
    function formatDate(iso) {
        if (!iso) return '';
        return new Date(iso).toLocaleDateString('en-GB', {
            day: '2-digit', month: 'short', year: 'numeric'
        });
    }

    // ── Render Course Card ──
    function renderCard(purchase, index) {
        const card = document.createElement('div');
        card.className = 'course-card';
        card.style.animationDelay = `${index * 0.08}s`;
        
        // Handle bundle card specific styling
        if (purchase.course_id === 'tri-therapy-bundle') {
            card.classList.add('bundle-card');
            card.style.border = '2px solid var(--primary)';
        }

        const fallbackImage = 'images/course-default.png'; // Make sure you have a default image or it will fail gracefully
        const imageUrl = purchase.course_image || fallbackImage;
        const durationText = purchase.course_duration || '—';

        card.innerHTML = `
            <div class="course-thumbnail">
                <img src="${imageUrl}" alt="${purchase.course_name_ar || purchase.course_id}" style="width:100%;height:100%;object-fit:cover;">
            </div>
            <div class="course-info">
                <h3>${purchase.course_name_ar || purchase.course_id}</h3>
                <p style="margin-bottom: 0.5rem;"><i class="ph ph-calendar-check" style="margin-left:4px;"></i> تم الشراء في: <span dir="ltr">${formatDate(purchase.purchased_at)}</span></p>
                <p>${purchase.course_description || ''}<br><br><strong><i class="ph ph-clock" style="margin-left:4px;"></i> المدة:</strong> <span dir="ltr">${durationText}</span></p>
                <a href="course-${purchase.course_id}.html" class="btn-primary" style="display:block;text-align:center;margin-top:1.5rem;width:100%;">
                    بدء التعلم <i class="ph ph-arrow-left" style="margin-right:6px;"></i>
                </a>
            </div>
        `;
        return card;
    }

    // ── Render Empty State ──
    function renderEmpty() {
        return `
            <div class="empty-state">
                <div class="empty-icon"><i class="ph ph-books"></i></div>
                <h2>لا يوجد كورسات بعد</h2>
                <p>لم تقم بشراء أي كورسات بعد.<br>تصفح برامجنا وابدأ رحلتك.</p>
                <a href="index.html#courses" class="btn-primary">تصفح الكورسات</a>
            </div>
        `;
    }

    // ── Main: Load Courses ──
    async function loadMyCourses() {
        const session = getSession();
        const user = getUser();

        // Not logged in → redirect
        if (!session?.access_token || !user) {
            window.location.href = 'index.html';
            return;
        }

        // Show user name
        const displayName = user?.user_metadata?.name || user?.email?.split('@')[0] || 'طالب';
        document.getElementById('nav-user-name').textContent = displayName;
        document.getElementById('hero-heading').textContent = `كورسات ${displayName}`;

        const grid = document.getElementById('courses-grid');

        try {
            const res = await fetch(`${API_BASE}/api/my-courses`, {
                headers: { 'Authorization': `Bearer ${session.access_token}` }
            });

            if (res.status === 401) {
                // Session expired
                handleLogout();
                return;
            }

            const purchases = await res.json();

            // No purchases → show empty state (don't redirect, let them browse)
            if (!purchases || purchases.length === 0) {
                grid.innerHTML = renderEmpty();
                return;
            }

            // Render stats
            const totalInvested = purchases.reduce((sum, p) => sum + parseFloat(p.amount_paid || 0), 0);
            document.getElementById('stat-count').textContent = purchases.length;
            document.getElementById('stat-invested').textContent = `${totalInvested} ج.م`;
            document.getElementById('stats-bar').style.display = 'flex';

            // Render cards
            grid.innerHTML = '';
            purchases.forEach((purchase, i) => {
                grid.appendChild(renderCard(purchase, i));
            });

        } catch (err) {
            console.error('Failed to load courses:', err);
            grid.innerHTML = `
                <div class="loading-state">
                    <i class="ph ph-warning-circle" style="color:#ef4444;"></i>
                    <p style="color:#ef4444;">فشل في تحميل الكورسات. يرجى المحاولة مرة أخرى.</p>
                    <button class="btn-outline" onclick="loadMyCourses()" style="margin-top:1rem;">إعادة المحاولة</button>
                </div>
            `;
        }
    }

    // ── Boot ──
    loadMyCourses();
    </script>
</body>
</html>
