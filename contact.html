<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Dr. Marwa Badr</title>
    <meta name="description" content="Get in touch with Dr. Marwa Badr. Send a message, inquiry, or ask for help.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css?v=3">
    <!-- Favicon & App Icons -->
    <link rel="icon" href="images/profile-pic-nav.png" type="image/png">
    <link rel="apple-touch-icon" href="images/profile-pic-nav.png">
    
    <!-- SEO & Social Media Meta Tags -->
    <meta name="description" content="Dr. Marwa Badr - Consultant & Trainer for Mental Health Professionals. Advanced training in CBT, DBT, and ACT therapies.">
    <meta name="keywords" content="Dr. Marwa Badr, دكتورة مروة بدر, العلاج النفسي, CBT, DBT, ACT, العلاج المعرفي السلوكي, كورسات علم نفس, تدريب أخصائيين نفسيين">
    <meta name="author" content="Dr. Marwa Badr">
    
    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:title" content="Dr. Marwa Badr Platform">
    <meta property="og:description" content="Empowering psychologists with advanced evidence-based practices (CBT, DBT, ACT).">
    <meta property="og:image" content="https://drmarwa.pages.dev/images/profile-pic-nav.png">
    <meta property="og:url" content="https://drmarwa.pages.dev/">
    <meta property="og:type" content="website">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dr. Marwa Badr Platform">
    <meta name="twitter:description" content="Empowering psychologists with advanced evidence-based practices (CBT, DBT, ACT).">
    <meta name="twitter:image" content="https://drmarwa.pages.dev/images/profile-pic-nav.png">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-07XVN01PR3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-07XVN01PR3');
    </script>
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo" style="display:flex;align-items:center;gap:0.5rem;">
                <img src="images/profile-pic-nav.png" alt="Dr. Marwa" class="logo-img">
                Dr. Marwa
            </a>
            <div style="display:flex;align-items:center;gap:1rem;">
                <a href="index.html" style="font-size:0.85rem;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:0.3rem;"><i class="ph ph-arrow-left"></i> Back to Home</a>
                <button id="theme-toggle" aria-label="Toggle Theme">
                    <i class="ph ph-sun" id="theme-icon-light"></i>
                    <i class="ph ph-moon" id="theme-icon-dark"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="legal-page">
        <!-- Hero -->
        <div class="legal-hero">
            <div class="container">
                <h1>Contact Us</h1>
                <p>Have an inquiry or need help? Reach out below.</p>
            </div>
        </div>

        <div class="container" style="max-width: 700px; padding-bottom: 4rem;">
            <div class="contact-wrapper glass-card" style="padding: 2.5rem; border: 1px solid var(--border); border-radius: 12px; background: var(--card-bg);">
                <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
                    <!-- Web3Forms Access Key -->
                    <input type="hidden" name="access_key" value="b5caa9c4-98eb-41b9-a5db-11bc0a6f9675">
                    <input type="hidden" name="subject" value="📩 رسالة جديدة من صفحة اتصل بنا - منصة د. مروة بدر">
                    
                    <div class="form-group" style="margin-bottom: 1.25rem;">
                        <input type="text" name="name" placeholder="Your Name" required
                            style="width: 100%; padding: 0.85rem; border: 1px solid var(--border); border-radius: var(--border-radius-sm); background-color: var(--bg); color: var(--text);">
                    </div>
                    <div class="form-group" style="margin-bottom: 1.25rem;">
                        <input type="email" name="email" placeholder="Your Email" required
                            style="width: 100%; padding: 0.85rem; border: 1px solid var(--border); border-radius: var(--border-radius-sm); background-color: var(--bg); color: var(--text);">
                    </div>
                    <div class="form-group" style="margin-bottom: 1.25rem;">
                        <textarea name="message" rows="6" placeholder="Your Message or Inquiry" required
                            style="width: 100%; padding: 0.85rem; border: 1px solid var(--border); border-radius: var(--border-radius-sm); background-color: var(--bg); color: var(--text); resize: vertical;"></textarea>
                    </div>
                    <!-- Honeypot Spam Protection -->
                    <input type="checkbox" name="botcheck" class="hidden" style="display: none;">
                    <button type="submit" class="btn-primary" style="width: 100%; padding: 1rem; font-size: 1.05rem;">Send Message</button>
                </form>
            </div>
        </div>
    </div>

    <footer style="background:var(--alt-bg);border-top:1px solid var(--border);padding:1.5rem 0;margin-top:4rem;">
        <div class="container" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;">
            <p style="font-size:0.8rem;color:var(--muted);margin:0;">&copy; 2026 Dr. Marwa Badr Ahmed. All rights reserved.</p>
            <div style="display:flex;gap:1.5rem;">
                <a href="terms.html" class="footer-link" style="font-size:0.78rem;">Terms</a>
                <a href="refund-policy.html" class="footer-link" style="font-size:0.78rem;">Refund</a>
                <a href="privacy-policy.html" class="footer-link" style="font-size:0.78rem;">Privacy</a>
            </div>
        </div>
    </footer>
    <script>
        const saved = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });
    </script>
</body>
</html>
